<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Zema</title>
</head>

<body
    class="bg-linear-to-l from-[#191970] to-[#3030D6] h-screen w-screen overflow-x-hidden flex justify-center items-center">
    <div class="bg-[#D9D9D9] w-full md:w-1/2 h-1/2 rounded-xl shadow-[0_0_100px_20px_rgba(48,48,214,1)] inline-flex">
        <div class="bg-black h-full w-2/10 lg:w-1/10 rounded-l-xl">

        </div>
        <div class="flex-1 flex justify-center items-center">
            <div class="w-80 xl:w-[90%] h-1/2 flex flex-col gap-4">
                
                <div class="h-1/3 flex justify-center items-center w-full">
                    <div class="w-15 h-11 bg-[#D9D9D9] flex justify-center items-center border-t-2 border-t-[#C0C0C0] border-l-2 border-l-[#C0C0C0] border-b-2 border-solid border-b-[#C0C0C0] rounded-l-md">
                        <i class="fa-solid fa-user text-white"></i>
                    </div>
                    <div class="h-11 flex-1 bg-[#D3D3D3] flex items-center justify-center border-2 border-solid border-[#C0C0C0] rounded-r-md">
                        <input type="text" name="cpf" id="cpf" placeholder="XXX.XXX.XXX-XX" class="text-center text-xl focus:outline-none text-[#A9A9A9]">
                    </div>
                </div>

                <div class="h-1/3 flex justify-center items-center w-full">
                    <div class="w-15 h-11 bg-[#D9D9D9] flex justify-center items-center border-t-2 border-t-[#C0C0C0] border-l-2 border-l-[#C0C0C0] border-b-2 border-solid border-b-[#C0C0C0] rounded-l-md">
                        <i class="fa-solid fa-lock text-white"></i>
                    </div>
                    <div class="h-11 flex-1 bg-[#D3D3D3] flex items-center justify-center border-2 border-solid border-[#C0C0C0] rounded-r-md">
                        <input type="password" name="password" id="password" placeholder="************" class="text-center text-xl focus:outline-none text-[#A9A9A9]">
                    </div>
                </div>

                <div class="flex-1 flex justify-center items-center">
                    <div
                        class="bg-linear-to-l from-[#191970] to-[#3030D6] w-1/2 h-10 rounded-2xl inline-flex justify-center items-center gap-2">
                        <button type="submit"><i class="text-[#D9D9D9]">ENTRAR</i></button>
                        <i class="fa-solid fa-circle-arrow-right text-[#D9D9D9]"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
