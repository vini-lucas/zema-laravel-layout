<!DOCTYPE html>

    <title>Zema</title>
</head>

<body class="bg-linear-to-l from-[#191970] to-[#3030D6] h-screen w-screen flex flex-col overflow-x-hidden">

    <!-- Itens do topo -->
    <div class="w-full flex items-center h-[8.33%] px-6 justify-center">

        <!-- Logo da Zema -->
        <div class="flex items-center justify-center h-full w-12 ml-auto mr-auto">

        <!-- Navbar -->
        <nav

            <div class="relative flex h-full items-center justify-center">
                <span>INSS</span>
                <span class="absolute bottom-0 left-0 w-full h-2 bg-linear-to-l from-[#191970] to-[#3030D6]"></span>
            </div>
            <div class="relative flex h-full items-center justify-center">

            </div>
            <div class="relative flex h-full items-center justify-center">
                <span>EMPRESAS</span>

            <div class="relative flex h-full items-center justify-center">

                <span>PLANOS DE PRODUTOS</span>

        <!-- Ícone de perfil -->
        <div class="bg-[#D9D9D9] h-full w-[4%] rounded-t-2xl rounded-b-2xl flex items-center justify-center ml-auto mr-auto shadow-[0_20px_25px_-5px_rgba(0,0,0,0.3)] shadow-black/30 z-50 cursor-pointer"
            id="iconProfile" onclick="return openModalProfile()">
            <i class="fa-solid fa-user"></i>
        </div>

        <!-- Modal de opções de perfil -->
        <div class="h-13.5 w-[3.8%] absolute right-0 mr-11 flex flex-col justify-center items-center" id="modalProfile">
            <span
                class="text-xs h-[50%] w-full bg-[#D9D9D9] rounded-t-2xl flex justify-center items-center hover:transition transition hover:delay-50 delay-50 hover:bg-[#C0C0C0] cursor-pointer"
                id="optionProfile"><a href="">PERFIL</a></span>

                class="text-xs h-[50%] w-full bg-[#D9D9D9] rounded-b-2xl flex justify-center items-center hover:transition transition hover:delay-50 delay-50 hover:bg-[#C0C0C0] cursor-pointer shadow-xl shadow-black/30"><a
                    href="">SAIR</a></span>

    <!-- Modals das propostas -->
    <div class="flex w-full items-center justify-center h-[83.34%]">

        <section class="flex flex-col h-[95%] w-[96.25%]">

            <!-- Linha de três propostas -->

                <!-- Modal de cada proposta -->

                    <div class="h-[15.3%] w-[91.67%] inline-flex">

                        <!-- Informação do número da proposta -->
                        <div class="h-full w-[50%] inline-flex justify-center items-center mt-0.75">
                            <span
                                class="bg-linear-to-l from-[#191970] to-[#3030D6] bg-clip-text text-transparent font-serif text-xs font-">PROPOSTA</span>
                            <span
                                class="bg-linear-to-l from-[#A9A9A9] to-[#C0C0C0] bg-clip-text text-transparent font-serif text-xs">#XXXXX</span>
                        </div>

                        <div class="h-full w-[50%] flex justify-center items-center">

                            <!-- Banner de alerta de pendências -->
                            <div
                                class="w-full h-[75.39%] inline-flex border border-l-2 border-solid border-white rounded-xs rounded-r-sm bg-[#F2C94C] shadow-md shadow-black/30">
                                <div class="w-[18%] h-full flex justify-center items-center">
                                    <i class="fa-solid fa-exclamation text-xs text-[#FDF8E8]"></i>
                                </div>
                                <div class="flex-1 flex flex-col justify-center items-center rounded-r-sm">
                                    <span class="text-[7px] text-[#2F3032]">ATENÇÃO! HÁ PENDÊNCIAS NA PROPOSTA.</span>
                                    <span class="text-[7px] text-[#2F3032]">CLIQUE AQUI PARA VERIFICÁ-LAS.</span>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Traço de separação -->
                    <div class="bg-[#C0C0C0] w-[91.67%] h-px mt-0.75"></div>

                    <!-- Corpo da proposta -->
                    <div class="bg-[#D9D9D9] h-full w-full inline-flex items-center">

                        <!-- Dados dentro do corpo da proposta -->
                        <div class="h-full w-[50%] flex flex-col items-end justify-end">
                            <div class="w-[91.67%] h-[8.89%] inline-flex justify-center items-center mt-2 ">
                                <div class="flex-1 flex justify-start">
                                    <div class="bg-[#C0C0C0] h-px w-[93%]"></div>
                                </div>
                                <span class="text-[10px]">DADOS</span>
                                <div class="flex-1 flex justify-end">
                                    <div class="bg-[#C0C0C0] h-px w-[93%]"></div>
                                </div>
                            </div>
                            <div class="bg-amber-500 h-full w-[91.67%]">

                                <!-- CPF do cliente -->
                                <div>

                                </div>

                                <!-- Nome do cliente -->
                                 <div>

                                 </div>

                                 <!-- Loja -->
                                  <div>

                                  </div>
                            </div>
                        </div>

                        <!-- Traço de separação -->
                        <div class="bg-[#C0C0C0] h-[82.22%] w-px"></div>

                        <div class="h-full w-[50%]">

                        </div>
                    </div>
                </div>

                <!-- Modal de cada proposta -->
                <div
                    class="flex bg-[#D9D9D9] w-[32.47%] h-[87%] mr-[0.65%] ml-[0.65%] mt-[1.30%] mb-[0.65%] shadow-xl shadow-black/30">

                </div>

                <!-- Modal de cada proposta -->
                <div
                    class="flex bg-[#D9D9D9] w-[32.47%] h-[87%] ml-[0.65%] mr-[1.30%] mt-[1.30%] mb-[0.65%] shadow-xl shadow-black/30">

                </div>

            </div>

            <!-- Linha de três propostas -->
            <div class="inline-flex w-full h-[50%]">

                <!-- Modal de cada proposta -->
                <div
                    class="flex bg-[#D9D9D9] w-[32.47%] h-[87%] ml-[1.30%] mr-[0.65%] mt-[0.65%] mb-[1.30%] shadow-xl shadow-black/30">

                </div>

                <!-- Modal de cada proposta -->
                <div
                    class="flex bg-[#D9D9D9] w-[32.47%] h-[87%] mr-[0.65%] ml-[0.65%] mt-[0.65%] mb-[1.30%] shadow-xl shadow-black/30">

                </div>

                <!-- Modal de cada proposta -->
                <div
                    class="flex bg-[#D9D9D9] w-[32.47%] h-[87%] ml-[0.65%] mr-[1.30%] mt-[0.65%] mb-[1.30%] shadow-xl shadow-black/30">

                </div>

            </div>

        </section>
    </div>

    <!-- Rodapé -->
    <footer class="w-full h-[8.33%] absolute bottom-0 inline-flex justify-center">
        <div
            class="absolute w-[50%] h-full bg-[#D9D9D9] shadow-[0px_0px_10px_10px_rgba(0,0,0,0.3)] justify-center items-center flex z-50">

            <!-- Pesquisar pelo CPF -->
            <div
                class="bg-[#D9D9D9] w-[23.4%] h-[39.67%] inline-flex border-2 border-solid border-[#3030D6] rounded-xs justify-between mr-[1.50%] shadow-xl shadow-black/30">

                <!-- Placeholder do CPF -->
                <div class="flex pl-2 pr-2 justify-center items-center h-full w-full">
                    <span class="text-xs text-[#A9A9A9] pl-1 pr-1">XXX.XXX.XXX-XX</span>
                </div>

                <!-- Lupa -->
                <div
                    class="bg-linear-to-l from-[#191970] to-[#3030D6] flex w-[18.22%] h-full justify-center items-center group hover:from-[#A9A9A9] hover:to-[#A9A9A9] hover:transition transition hover:delay-150 delay-150 duration-700 hover:duration-350 cursor-pointer border-l-2 hoborder-l-solid border-l-[#3030D6]">
                    <i
                        class="fa-solid fa-magnifying-glass text-xs text-[#A9A9A9] group-hover:text-[#191970] group-hover:transition transition group-hover:delay-150 delay-150 duration-700 group-hover:duration-700"></i>
                </div>
            </div>

            <!-- Traço de separação -->
            <div class="h-[77.78%] w-[0.19%] bg-[#C0C0C0]"></div>

            <!-- Pesquisar pela data -->
            <div
                class="bg-[#D9D9D9] w-[39.43%] h-[39.67%] inline-flex border-2 border-solid border-[#3030D6] rounded-xs justify-between ml-[1.50%] mr-[1.50%] shadow-xl shadow-black/30">

                <!-- Placeholder das datas -->
                <div class="flex pl-2 pr-2 justify-center items-center h-full w-full">
                    <span class="text-xs text-black pl-1 pr-1">DE</span>
                    <span class="text-xs text-[#A9A9A9] pl-1 pr-1">XX/XX/XXXX</span>
                    <span class="text-xs text-black pl-1 pr-1">À</span>
                    <span class="text-xs text-[#A9A9A9] pl-1 pr-1">XX/XX/XXXX</span>
                </div>

                <!-- Lupa -->
                <div
                    class="bg-linear-to-l from-[#191970] to-[#3030D6] flex w-[15.22%] h-full justify-center items-center group hover:from-[#A9A9A9] hover:to-[#A9A9A9] hover:transition transition hover:delay-150 delay-150 duration-700 hover:duration-350 cursor-pointer border-l-2 hoborder-l-solid border-l-[#3030D6]">
                    <i
                        class="fa-solid fa-magnifying-glass text-xs text-[#A9A9A9] group-hover:text-[#191970] group-hover:transition transition group-hover:delay-150 delay-150 duration-700 group-hover:duration-700"></i>
                </div>

            </div>

            <!-- Traço de separação -->
            <div class="h-[77.78%] w-[0.19%] bg-[#C0C0C0]"></div>

            <!-- Pesquisar pelo número da proposta -->
            <div
                class="bg-[#D9D9D9] w-[23.4%] h-[39.67%] inline-flex border-2 border-solid border-[#3030D6] rounded-xs justify-between ml-[1.50%] shadow-xl shadow-black/30">

                <!-- Placeholder do número da proposta -->
                <div class="flex pl-2 pr-2 justify-center items-center h-full w-full">
                    <span class="text-xs text-[#A9A9A9] pl-1 pr-1">#XXXXX</span>
                </div>

                <!-- Lupa -->
                <div
                    class="bg-linear-to-l from-[#191970] to-[#3030D6] flex w-[18.22%] h-full justify-center items-center group hover:from-[#A9A9A9] hover:to-[#A9A9A9] hover:transition transition hover:delay-150 delay-150 duration-700 hover:duration-350 cursor-pointer border-l-2 hoborder-l-solid border-l-[#3030D6]">
                    <i
                        class="fa-solid fa-magnifying-glass text-xs text-[#A9A9A9] group-hover:text-[#191970] group-hover:transition transition group-hover:delay-150 delay-150 duration-700 group-hover:duration-700"></i>
                </div>

            </div>

            <!-- Botão para aparecer relatório das propostas e configurações avançadas -->
            <div
                class="absolute w-[3.7%] h-[23.66%] inline-flex justify-center items-center top-0 right-0 cursor-pointer">
                <div class="w-full h-full flex justify-center items-center pt-1" id="buttonOpenModalGearAdvanced">
                    <i class="fa-solid fa-bars text-[#191970] text-sm" onclick="return openModalGearAdvanced()"></i>
                </div>
            </div>

        </div>

        <!-- Relatório das propostas e configurações avançadas -->
        <div class="h-full w-[25%] ml-85 flex justify-end">
            <div class="bg-[#D9D9D9] shadow-[5px_10px_10px_0px_rgba(0,0,0,0.6)] h-[30%] w-[15%] flex justify-center items-center"
                id="modalGearAdvanced">
                <span class="flex items-center">
                    <i class="fa-solid fa-file text-xs text-[#006400] cursor-pointer"></i>
                </span>
                <span class="flex items-center">
                    <i class="fa-solid fa-gear text-xs text-[#FF8C00] cursor-pointer"></i>
                </span>
            </div>
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script>
        function openModalGearAdvanced() {
            if (document.getElementById("modalGearAdvanced").classList.contains("modalActive")) {
                gsap.to('#modalGearAdvanced', {
                    x: 0,
                    duration: 1,
                    onComplete: () => {
                        document.getElementById("modalGearAdvanced").classList.remove("modalActive");
                    }
                })

                gsap.to('#buttonOpenModalGearAdvanced', {
                    rotation: 0,
                    transformOrigin: 'center center'
                })
            } else {
                gsap.to('#modalGearAdvanced', {
                    x: 51,
                    duration: 1,
                    onComplete: () => {
                        document.getElementById("modalGearAdvanced").classList.add("modalActive");
                    }
                })

                gsap.to('#buttonOpenModalGearAdvanced', {
                    rotation: 90,
                    transformOrigin: 'center center',
                    y: 2,
                    x: 2
                })
            }
        }

        function openModalProfile() {
            if (document.getElementById('optionProfile').classList.contains('rounded-t-2xl')) {

                gsap.to('#modalProfile', {
                    y: 54,
                    onStart: () => {
                        setTimeout(() => {
                            document.getElementById('optionProfile').classList.remove('rounded-t-2xl')
                        }, 50);
                        document.getElementById('iconProfile').classList.remove('rounded-b-2xl');
                        document.getElementById('iconProfile').classList.remove('shadow-[0_20px_25px_-5px_rgba(0,0,0,0.3)]');
                    }
                })
            } else {

                gsap.to('#modalProfile', {
                    y: 0,
                    onStart: () => {
                        document.getElementById('optionProfile').classList.add('rounded-t-2xl');
                        setTimeout(() => {
                            document.getElementById('iconProfile').classList.add('rounded-b-2xl')
                        }, 220);
                        setTimeout(() => {
                            document.getElementById('iconProfile').classList.add('shadow-[0_20px_25px_-5px_rgba(0,0,0,0.3)]'), 920
                        });
                    }
                })
            }

        }
    </script>
</body>

</html>
