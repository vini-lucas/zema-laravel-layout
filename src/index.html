<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Zema</title>
</head>

<body class="bg-[#DCDCDC] h-min-screen">

    <!-- Sidebar -->
    <div class="flex">
        <aside
            class="bg-[#3030D6] w-64 inset-y-0 fixed left-0 shadow-2xl transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out p-5 mt"
            id="aside">
            <button class="flex ml-45 mt-5 cursor-pointer sm:hidden" onclick="return openNavbar()">
                <i class="fa-solid fa-xmark text-xl text-[#DCDCDC]"></i>
            </button>
        </aside>
    </div>

    <!-- Navbar -->
    <nav class="bg-linear-to-l from-[#191970] to-[#3030D6] h-30 w-full flex items-center justify-between p-5">

        <button id="buttonOpenSidebar" class="flex ml-10 cursor-pointer">
            <i class="fa-solid fa-bars text-2xl text-[#DCDCDC]"></i>
        </button>

        <div class="flex mr-10">
            <i class="fa-solid fa-user text-2xl text-[#DCDCDC]"></i>
        </div>
    </nav>

    <!-- Trilha de navegação -->
    <div class="w-full inline-flex gap-1 justify-end pr-2">
        <h6 class="text-[#808080]">Dashboard</h6>
        <span class="text-[#808080]">/</span>
        <h6 class="text-[#363636]">INSS</h6>
    </div>

    <!-- Conteúdo -->
    <section
        class="flex flex-col min-h-140 sm:min-h-118 border border-solid border-[#808080] rounded-md mx-3 my-2 sm:ml-67 transform duration-300 ease-in-out">

        <!-- Filtragem de propostas -->
        <div class="h-20 w-full flex-col mb-2">

            <div class="h-7 w-full inline-flex items-center gap-3">
                <span class="bg-[#808080] h-px flex-0.5 w-4 ml-3"></span>
                <h2 class="text-[#363636]">FILTRAGEM</h2>
                <div class="bg-[#808080] h-px flex-1 mr-3"></div>
            </div>

            <div class="w-full h-1/3 inline-flex justify-center gap-4">
                <div class="bg-[#C0C0C0] w-50 h-full border border-solid border-[#808080] rounded-md ml-3"></div>
                <div class="bg-[#C0C0C0] w-50 h-full border border-solid border-[#808080] rounded-md mr-3"></div>
            </div>

            <div class="bg-[#808080] h-px mx-3 mt-2"></div>
        </div>

        <!-- Listagem das propostas -->
        <div
            class="w-full h-full grid grid-cols-1 2xl:grid-cols-2 gap-4 2xl:gap-0 justify-items-center my-auto">

            <!-- Modal de cada proposta -->
            <div
                class="w-87 sm:w-145 h-80 border border-solid border-[#808080] rounded-md shadow-[0_0_15px_rgba(0,0,0,0.15)] shadow-black/30 mb-4 my-4">

                <!-- Informações superiores da proposta -->
                <div class="h-12 w-full inline-flex justify-center items-center">

                    <!-- Número da proposta -->
                    <div class="w-1/2 h-full flex justify-center items-center">
                        <span
                            class="bg-linear-to-l from-[#191970] to-[#3030D6] bg-clip-text text-transparent font-serif text-xs mr-1">PROPOSTA</span>
                        <span class="bg-[#A9A9A9] bg-clip-text text-transparent font-serif text-xs">#XXXXX</span>
                    </div>

                    <!-- Banner de alerta de pendências -->
                    <div class="flex-1 h-full">
                        <div
                            class="w-[99.5%] h-[98%] inline-flex border border-l-2 border-solid border-white rounded-xs rounded-r-sm bg-[#F2C94C] shadow-md shadow-black/30">
                            <div class="w-[18%] h-full flex justify-center items-center">
                                <i class="fa-solid fa-exclamation text-md text-[#FDF8E8]"></i>
                            </div>
                            <div class="flex-1 flex flex-col justify-center items-center rounded-r-sm">
                                <span class="text-[6px] sm:text-[10px] text-[#2F3032] font-semibold">ATENÇÃO! HÁ
                                    PENDÊNCIAS NA PROPOSTA.</span>
                                <span class="text-[6px] sm:text-[10px] text-[#2F3032] font-semibold">CLIQUE AQUI PARA
                                    VERIFICÁ-LAS.</span>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Traço de separação -->
                <div class="w-full h-px mt-2 sm:mt-1 flex justify-center">
                    <div class="bg-[#A9A9A9] w-71.5 sm:w-130 h-full"></div>
                </div>

                <!-- Corpo da proposta -->
                <div class="h-full w-full inline-flex items-center">

                    <!-- Lado esquerdo do corpo da proposta -->
                    <div class="w-1/2 h-full flex flex-col">

                        <div class="inline-flex w-36 sm:w-65 h-auto ml-7.5">
                            <div class="flex-1 flex items-center justify-start">
                                <div class="bg-[#A9A9A9] h-px w-12 sm:w-25"></div>
                            </div>
                            <span class="text-[10px] font-extrabold">DADOS</span>
                            <div class="flex-1 flex items-center justify-end">
                                <div class="bg-[#A9A9A9] h-px w-12 sm:w-25"></div>
                            </div>
                        </div>
                        <div class="flex-1 w-65 ml-7.5 mb-2">

                            <!-- CPF -->
                            <div class="w-25 h-20 flex flex-col items-center">
                                <span class="text-sm font-mono mr-18 sm:mr-0">CPF</span>
                                <div class="inline-flex">
                                    <div class="bg-[#A9A9A9] w-px h-8 ml-47 mr-2 sm:mr-0"></div>
                                    <div class="bg-[#A9A9A9] w-8 h-px ml-2 mr-2 mt-3 hidden sm:flex"></div>
                                    <div
                                        class="bg-[#D3D3D3] border border-solid border-[#A9A9A9] w-29 sm:w-35 h-7 rounded-md flex justify-center items-center mr-34 sm:mr-0">
                                        <span class="text-[#808080] text-sm">124.284.329-90</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Nome -->
                            <div class="w-25 h-20 flex flex-col items-center">
                                <span class="text-sm font-mono mr-18 sm:mr-0">NOME</span>
                                <div class="inline-flex">
                                    <div class="bg-[#A9A9A9] w-px h-8 ml-47 mr-2 sm:mr-0"></div>
                                    <div class="bg-[#A9A9A9] w-8 h-px ml-2 mr-2 mt-3 hidden sm:flex"></div>
                                    <div
                                        class="bg-[#D3D3D3] border border-solid border-[#A9A9A9] w-29 sm:w-35 h-7 rounded-md flex justify-center items-center mr-34 sm:mr-0">
                                        <span class="text-[#808080] text-sm">LUCAS VINICIUS</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Loja -->
                            <div class="w-25 h-20 flex flex-col items-center">
                                <span class="text-sm font-mono mr-18 sm:mr-0">LOJA</span>
                                <div class="inline-flex">
                                    <div class="bg-[#A9A9A9] w-px h-8 ml-47 mr-2 sm:mr-0"></div>
                                    <div class="bg-[#A9A9A9] w-8 h-px ml-2 mr-2 mt-3 hidden sm:flex"></div>
                                    <div
                                        class="bg-[#D3D3D3] border border-solid border-[#A9A9A9] w-29 sm:w-35 h-7 rounded-md flex justify-center items-center mr-34 sm:mr-0">
                                        <span class="text-[#808080] text-sm">PRÓ-VAREJO</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Traço de separação -->
                    <div class="w-px h-full flex items-start mt-4">
                        <div class="bg-[#A9A9A9] h-56 w-px"></div>
                    </div>



                </div>

            </div>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script>

        function openNavbar() {
            if (document.getElementById('aside').classList.contains('-translate-x-full')) {
                document.getElementById('aside').classList.remove('-translate-x-full');
            } else {
                document.getElementById('aside').classList.add('-translate-x-full');
            }
        }

        document.getElementById('buttonOpenSidebar').addEventListener('click', (e) => {
            e.preventDefault();
            openNavbar();
        })
    </script>
</body>

</html>
